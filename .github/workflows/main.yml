name: ubuntu
on: [push]
jobs:
  build:
    name: build with meson
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install help2man
        run:
          apt install help2man
      - name: Setup
        uses: BSFishy/meson-build@v1.0.3
        with:
          action: build
          meson-version: 1.9.1
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: build/waylogo
          archive: false
        
      
      
